[package]
name = "gema-cli"
description = "CLI for GemaPDF: pure-Rust portable PDF compression, no AGPL"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["pdf", "compression", "cli"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "gema"
path = "src/main.rs"

[dependencies]
gema-compress = { workspace = true, features = ["perceptual", "serde"] }
gema-edit = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lopdf.workspace = true
