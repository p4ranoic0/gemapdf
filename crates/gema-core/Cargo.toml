[package]
name = "gema-core"
description = "Pure-Rust portable PDF compression engine (WASM + native), no AGPL"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "compression", "wasm"]
categories = ["compression", "parser-implementations"]

[features]
default = []
# reservados para v2 (no implementados en v1):
# native = []  ; mozjpeg = []  ; webp = []  ; ghostscript = []  ; ocr = []
# Modo de calidad perceptual (spec 2026-07-11): búsqueda de q por imagen
# contra un SSIM2 objetivo. Opcional para que gema-wasm no lo pague.
perceptual = ["dep:ssimulacra2"]

[dependencies]
lopdf.workspace = true
image.workspace = true
flate2.workspace = true
thiserror.workspace = true
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.6"
ssimulacra2 = { version = "0.5", optional = true }

# §1.4: paralelización del bucle de imágenes (decode+búsqueda+encode) en nativo.
# Target-specific para que el wasm/Beta (single-thread) NUNCA lo arrastre.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
fax = "0.3.0"
mozjpeg-rs = "0.9.2"
ssimulacra2 = "0.5.1"
