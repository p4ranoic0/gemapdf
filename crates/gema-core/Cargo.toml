[package]
name = "gema-core"
description = "Pure-Rust portable PDF compression engine (WASM + native), no AGPL"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "compression", "wasm"]
categories = ["compression", "parser-implementations"]

[features]
default = []
# reservados para v2 (no implementados en v1):
# native = []  ; mozjpeg = []  ; webp = []  ; ghostscript = []  ; ocr = []

[dependencies]
lopdf.workspace = true
image.workspace = true
flate2.workspace = true
thiserror.workspace = true
jpeg-decoder = "0.3.2"

[dev-dependencies]
# Experimento encoder JPEG con subsampling 4:2:0 + Huffman optimizado (candidato
# a reemplazar image::JpegEncoder en el pipeline; solo examples/tests por ahora).
jpeg-encoder = "0.6"
