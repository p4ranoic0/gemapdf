[package]
name = "gema-core"
description = "Pure-Rust portable PDF compression engine (WASM + native), no AGPL"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
# Los arneses de investigación permanecen en el repositorio, pero no forman
# parte del crate distribuido. `usage_report` sí se conserva como ejemplo útil.
exclude = [
    "examples/dedup_probe.rs",
    "examples/diag_buckets.rs",
    "examples/diag_gray.rs",
    "examples/edu_loss.rs",
    "examples/enc_compare.rs",
    "examples/enc_mozjpeg.rs",
    "examples/mrc_spike.rs",
    "examples/ssim2_cmp.rs",
]
keywords = ["pdf", "compression", "wasm"]
categories = ["compression", "parser-implementations"]

[features]
default = []
# Deriva `Serialize` en el esquema JSON del reporte. Apagado por default para
# que el core sin features no arrastre serde.
serde = ["dep:serde"]
# Telemetría estructural experimental para arneses internos. No forma parte del
# build por default ni del contrato estable del core.
telemetry = []
# reservados para v2 (no implementados en v1):
# native = []  ; mozjpeg = []  ; webp = []  ; ghostscript = []  ; ocr = []
# Modo de calidad perceptual (spec 2026-07-11): búsqueda de q por imagen
# contra un SSIM2 objetivo + bake-off de encoder por imagen (§2). Opcional para
# que gema-wasm no lo pague (ni ssimulacra2 ni mozjpeg-rs entran al árbol wasm).
perceptual = ["dep:ssimulacra2", "dep:mozjpeg-rs"]

[dependencies]
lopdf.workspace = true
image.workspace = true
flate2.workspace = true
thiserror.workspace = true
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.6"
ssimulacra2 = { version = "0.5", optional = true }
# §2: bake-off de encoder por imagen dentro del modo perceptual (BaselineBalanced,
# Rust puro BSD-3). Opcional bajo `perceptual` → fuera del árbol wasm.
mozjpeg-rs = { version = "0.9.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

# §1.4: paralelización del bucle de imágenes (decode+búsqueda+encode) en nativo.
# La dependencia directa es target-specific: el wasm/Beta mantiene nuestro
# bucle serial. Dependencias upstream pueden incluir Rayon transitivamente.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
fax = "0.3.0"
mozjpeg-rs = "0.9.2"
serde_json = "1"
ssimulacra2 = "0.5.1"
