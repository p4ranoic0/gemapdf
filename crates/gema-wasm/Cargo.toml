[package]
name = "gema-wasm"
description = "WASM bindings for GemaPDF: pure-Rust portable PDF compression, no AGPL"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["pdf", "compression", "wasm"]
categories = ["compression", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gema-core = { path = "../gema-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# lopdf (vía rand) arrastra getrandom 0.4, que en wasm32-unknown-unknown
# necesita el backend `wasm_js` activado explícitamente. Lo declaramos
# como dep directo SOLO para wasm para encender esa feature en el grafo;
# el cfg `getrandom_backend="wasm_js"` se fija en .cargo/config.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
